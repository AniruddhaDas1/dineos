<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>DineFlow</title>
    <script type="text/javascript">
      // Instant redirect from 404 path to hash route on GitHub Pages
      var pathname = window.location.pathname;
      var repo = "/dineos";
      var subpath = pathname.startsWith(repo) ? pathname.slice(repo.length) : pathname;
      if (subpath === "" || subpath === "/") {
        subpath = "/";
      }
      var target = window.location.origin + repo + "/#" + subpath + window.location.search + window.location.hash;
      window.location.replace(target);
    </script>
  </head>
  <body>
  </body>
</html>
